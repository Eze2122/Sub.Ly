name: Android test AAB

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Generate and build Android App Bundle
    runs-on: ubuntu-latest
    timeout-minutes: 45

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out source from billing-fix
        uses: actions/checkout@v4
        with:
          ref: billing-fix

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install JavaScript dependencies
        run: yarn install --non-interactive --no-progress

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install
        env:
          CI: "1"

      - name: Build Android App Bundle
        working-directory: frontend/android
        run: ./gradlew bundleRelease --no-daemon
        env:
          CI: "1"

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: subly-android-aab
          path: frontend/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
