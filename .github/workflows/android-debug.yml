name: Android test APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - ".github/workflows/android-debug.yml"

permissions:
  contents: read

jobs:
  build-android:
    name: Generate and build standalone Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install JavaScript dependencies
        run: yarn install --non-interactive --no-progress

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install
        env:
          CI: "1"

      - name: Build standalone release APK
        working-directory: frontend/android
        run: ./gradlew assembleRelease --no-daemon
        env:
          CI: "1"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: subly-android-test-apk
          path: frontend/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
